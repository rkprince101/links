<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Useful websites, explained</title>
    <meta name="description" content="Every website, GitHub repo and AI tool from the @useful.cursor reels, in one place." />
    <meta property="og:title" content="Useful websites, explained" />
    <meta property="og:description" content="Every website, GitHub repo and AI tool from the reels, in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rkprince101.github.io/links/og.png" />
    <meta property="og:url" content="https://rkprince101.github.io/links/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FEF7FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236750A4'/%3E%3Cpath d='M22 14v32l9-8 6 13 6-3-6-12h12z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,300..900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <span class="eyebrow" id="eyebrow">Useful websites, explained</span>
          <h1 id="handle">@useful.cursor<span class="cursor" aria-hidden="true"></span></h1>
          <p class="tagline" id="tagline"></p>
        </div>
        <nav class="links" aria-label="Follow">
          <a class="chip-link" id="ig" href="#" target="_blank" rel="noopener">Instagram ↗<span class="sr"> (opens in a new tab)</span></a>
          <a class="chip-link" id="yt" href="#" target="_blank" rel="noopener">YouTube ↗<span class="sr"> (opens in a new tab)</span></a>
        </nav>
      </header>

      <section class="latest" id="latest" aria-label="Latest case" hidden></section>

      <div class="toolbar">
        <div class="tabs" id="tabs" role="group" aria-label="Filter by kind"></div>
        <label class="search">
          <span class="sr">Search the cases</span>
          <input id="q" type="search" placeholder="Search sites, repos, tools" autocomplete="off" />
        </label>
      </div>

      <p class="sr" id="results-status" role="status" aria-live="polite"></p>
      <section class="cases" id="cases" aria-label="Cases"></section>
      <div class="empty" id="empty" hidden><b>Nothing matches that yet.</b> Try another word, or pick All.</div>

      <section class="extras" id="extras-wrap" aria-labelledby="extras-title">
        <div class="section-head">
          <h2 id="extras-title">Made by me</h2>
        </div>
        <div id="extras"></div>
      </section>

      <footer class="foot">
        <p>Each case was checked on the day it was filed. Sites change, so check prices and features before you rely on them.</p>
      </footer>
    </div>

    <script src="links.js"></script>
    <script src="app.js"></script>
  </body>
</html>
